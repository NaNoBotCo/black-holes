" width="20" height="20" fill="#ffb347"/><path d="M269.0,293.0 L518.0,223.6 L583.0,239.2 L590.8,260.5" fill="none" stroke="#ffb347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="452.0" font-size="12" fill="#ffb347" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >this one lands on the disk → paint the disk's colour, shifted</text><rect x="258" y="172" width="20" height="20" fill="#8fd0ff"/><path d="M269.0,183.0 L544.0,171.6 L635.0,166.4 L752.0,145.6 L905.0,70.0" fill="none" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="474.0" font-size="12" fill="#8fd0ff" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >this one bends and leaves → paint the star it ends up pointing at</text><rect x="258" y="326" width="20" height="20" fill="#ffd27a"/><path d="M269.0,337.0 L544.0,343.2 L622.0,338.0 L674.0,343.2 L752.0,322.4 L783.2,275.6 L772.8,218.4 L713.0,176.8 L622.0,176.8 L580.4,200.2" fill="none" stroke="#ffd27a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="496.0" font-size="12" fill="#ffd27a" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >this one loops once before it lands: the disk's far side, seen over the top</text><text x="24.0" y="34.0" font-size="20" fill="#f3efe6" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >One dot, one ray, run backwards</text><text x="24.0" y="56.0" font-size="12" fill="#b3ac9e" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >the computer never draws the black hole; it draws what the black hole does to light that would have reached each dot</text></svg>