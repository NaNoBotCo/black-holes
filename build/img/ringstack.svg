<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" font-size="13" fill="#f3efe6"><title>The photon ring subrings</title><desc>Schematic of the direct image and the n=1,2,3 subrings.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about=""><dc:creator>Nan, hongdam.net</dc:creator><dc:source>https://nanobotco.github.io/black-holes/</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><dc:description>computed by tools/figures.py from the equation it shows</dc:description></cc:Work></rdf:RDF></metadata><rect width="960" height="440" fill="#000"/><rect width="960" height="440" fill="#000"/><circle cx="300.00" cy="230.00" r="219.07" fill="none" stroke="#ffb347" stroke-width="26" opacity="0.35"/><circle cx="300.00" cy="230.00" r="219.07" fill="none" stroke="#ffb347" stroke-width="9.0" opacity="1.0"/><circle cx="300.00" cy="230.00" r="178.50" fill="none" stroke="#ffd27a" stroke-width="1.36652221782584" opacity="1.0"/><circle cx="300.00" cy="230.00" r="176.75" fill="none" stroke="#ffd27a" stroke-width="1.2" opacity="1.0"/><circle cx="300.00" cy="230.00" r="176.67" fill="none" stroke="#ffd27a" stroke-width="1.2" opacity="1.0"/><circle cx="300.00" cy="230.00" r="176.67" fill="none" stroke="#f3efe6" stroke-width="1" stroke-dasharray="3 3" opacity="1.0"/><text x="300.0" y="235.0" font-size="13" fill="#b3ac9e" text-anchor="middle" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >shadow</text><text x="24.0" y="34.0" font-size="20" fill="#f3efe6" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >The photon ring is a stack</text><text x="24.0" y="56.0" font-size="12" fill="#b3ac9e" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >light that half-circles the hole once, twice, three times before leaving; each subring is e^π ≈ 23 times thinner</text><text x="620.0" y="150.0" font-size="16" fill="#ffb347" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >n = 0</text><text x="680.0" y="150.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >the direct image of the disk</text><text x="620.0" y="196.0" font-size="16" fill="#ffd27a" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >n = 1</text><text x="680.0" y="196.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >one half-turn: the far side of the disk,</text><text x="680.0" y="211.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >over the top</text><text x="620.0" y="242.0" font-size="16" fill="#ffd27a" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >n = 2</text><text x="680.0" y="242.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >one full turn: a ring 23× thinner, on</text><text x="680.0" y="257.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >the edge of the shadow</text><text x="620.0" y="288.0" font-size="16" fill="#ffd27a" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >n = 3…</text><text x="680.0" y="288.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >thinner again; the sum converges on b =</text><text x="680.0" y="303.0" font-size="12" fill="#f3efe6" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >3√3 M</text><text x="936.0" y="420.0" font-size="11" fill="#b3ac9e" text-anchor="end" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Gralla, Holz &amp; Wald 2019; Johnson et al. 2020 — a space telescope could resolve n = 1</text></svg>