<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" font-size="13" fill="#f3efe6"><title>The lunar nodes: Rahu and Ketu</title><desc>The Moon's tilted orbit crosses the ecliptic at two points that regress every 18.6 years.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about=""><dc:creator>Nan, hongdam.net</dc:creator><dc:source>https://nanobotco.github.io/black-holes/</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><dc:description>computed by tools/figures.py from the equation it shows</dc:description></cc:Work></rdf:RDF></metadata><rect width="960" height="440" fill="#000"/><rect width="960" height="440" fill="#000"/><ellipse cx="480" cy="230" rx="330" ry="90" fill="none" stroke="#ffd27a" stroke-width="1.4" stroke-dasharray="4 4"/><text x="820.0" y="234.0" font-size="11" fill="#ffd27a" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >the Sun's path</text><ellipse cx="480" cy="230" rx="330" ry="90" fill="none" stroke="#8fd0ff" stroke-width="1.6" transform="rotate(-9 480 230)"/><text x="140.0" y="164.0" font-size="11" fill="#8fd0ff" text-anchor="end" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >the Moon's path, tilted 5.1°</text><circle cx="780.00" cy="190.00" r="7.00" fill="#000" stroke="#ff6a5e" stroke-width="2.5" opacity="1.0"/><text x="780.0" y="214.0" font-size="12" fill="#ff6a5e" text-anchor="middle" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Rahu ☊ — the ascending node</text><circle cx="180.00" cy="270.00" r="7.00" fill="#000" stroke="#ff6a5e" stroke-width="2.5" opacity="1.0"/><text x="180.0" y="256.0" font-size="12" fill="#ff6a5e" text-anchor="middle" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Ketu ☋ — the descending node</text><circle cx="480.00" cy="230.00" r="18.00" fill="#ffd27a" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="480.0" y="235.0" font-size="18" fill="#000" text-anchor="middle" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >☉</text><text x="24.0" y="34.0" font-size="20" fill="#f3efe6" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >Rahu is a point, not a body — and it has an orbit</text><text x="24.0" y="56.0" font-size="12" fill="#b3ac9e" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >eclipses happen only where the Moon's tilted path crosses the Sun's; the crossing points drift backwards once every 18.6 years</text><text x="936.0" y="400.0" font-size="11" fill="#b3ac9e" text-anchor="end" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Indian astronomers computed the nodes by the 5th century (Āryabhaṭa, 499); the Thai and Lanna calendar carries them as พระราหู</text><text x="936.0" y="418.0" font-size="11" fill="#b3ac9e" text-anchor="end" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >an invisible thing, known by its period and by the light it takes away: the oldest model of a light-eater</text></svg>