l="#b3ac9e" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >against the inner solar system, to scale</text><circle cx="720.00" cy="300.00" r="31.61" fill="none" stroke="#8fd0ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.9"/><text x="746.3" y="273.7" font-size="11" fill="#8fd0ff" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Neptune</text><circle cx="720.00" cy="300.00" r="41.48" fill="none" stroke="#8fd0ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.9"/><text x="753.3" y="266.7" font-size="11" fill="#8fd0ff" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Pluto</text><circle cx="720.00" cy="300.00" r="175.35" fill="none" stroke="#c8a6ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.9"/><text x="848.0" y="172.0" font-size="11" fill="#c8a6ff" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >Voyager 1, 2025</text><circle cx="720.00" cy="300.00" r="67.38" fill="#000" stroke="#ffb347" stroke-width="2" opacity="1.0"/><circle cx="720.00" cy="300.00" r="175.20" fill="none" stroke="#ffb347" stroke-width="1" stroke-dasharray="2 3" opacity="0.8"/><text x="720.0" y="489.2" font-size="11" fill="#ffb347" text-anchor="middle" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >M87*: horizon 128 au across; shadow ~330 au</text><text x="520.0" y="40.0" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="800" font-family="'Avenir Next Condensed','Arial Narrow Bold',Impact,system-ui,sans-serif" >M87*, 6.5 billion suns</text><text x="520.0" y="60.0" font-size="11.5" fill="#b3ac9e" text-anchor="start" font-weight="400" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif" >against the outer solar system, to scale</text><text x="940.0" y="506.0" font-size="11" fill="#b3ac9e